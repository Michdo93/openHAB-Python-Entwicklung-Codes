# Unit-Tests bei jedem Push. Die Integrationstests brauchen ein echtes openHAB
# und werden in der CI automatisch übersprungen (siehe kapitel19_tests/tests/conftest.py).
name: Tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest -v kapitel19_tests
